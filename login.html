<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <img src="logo.svg" style="width:150px;display:block;margin:0 auto;" alt="Logo">
        <h2 style="text-align:center;">TAKASLASANA</h2>
        <p style="text-align:center;">
            Para Değil, Değer Takas Et.
        </p>

        <!-- Tarayıcı autofill sorununu engellemek için autocomplete="off" eklendi -->
        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="E-posta"
                required
                autocomplete="off"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <input
                type="password"
                id="login-password"
                placeholder="Şifre"
                required
                autocomplete="new-password"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <button
                type="submit"
                class="button"
                style="width:100%;margin-bottom:15px;"
            >
                Giriş Yap
            </button>
        </form>

        <button
            id="google-login"
            class="button"
            style="
                width:100%;
                background:#ffffff;
                color:#000;
                border:1px solid #ddd;
            "
        >
            Google ile Giriş Yap
        </button>

        <p style="margin-top:20px;text-align:center;">
            Hesabın yok mu?
            <a href="register.html">Üye Ol</a>
        </p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDiEf4SXghJpXUiHIrflLk8lnvaAk7LnUI",
        authDomain: "takasla-e2013.firebaseapp.com",
        projectId: "takasla-e2013",
        storageBucket: "takasla-e2013.firebasestorage.app",
        messagingSenderId: "324778736339",
        appId: "1:324778736339:web:d1c25d9aff143c35833226",
        measurementId: "G-CX29N06BZ7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const loginForm = document.getElementById("login-form");
    if (loginForm) {
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            // Firebase'e gerçekten hangi şifrenin gittiğini F12 konsolundan görebilirsiniz
            console.log("Firebase'e gönderilen e-posta:", email);
            console.log("Firebase'e gönderilen şifre uzunluğu:", password.length);

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                alert("Hoş geldin! Giriş başarılı: " + userCredential.user.email);
                window.location.href = "index.html";
            } catch (error) {
                console.error("Firebase Hata Kodu:", error.code);
                alert("Giriş başarısız! E-posta veya şifre hatalı. (Hata: " + error.code + ")");
            }
        });
    }

    const googleBtn = document.getElementById("google-login");
    if (googleBtn) {
        googleBtn.addEventListener("click", async () => {
            try {
                await signOut(auth);
                await signInWithPopup(auth, provider);
                alert("Google ile başarıyla giriş yapıldı!");
                window.location.href = "index.html";
            } catch (error) {
                alert(error.message);
            }
        });
    }
</script>

</body>
</html>
