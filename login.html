<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="text-align:center;">TEST EKRANI</h2>
        
        <!-- Firebase'in verdiği yanıt buraya yazılacak -->
        <div id="sonuc" style="padding: 15px; margin-bottom: 15px; text-align: center; font-weight: bold; background: #f0f0f0; border-radius: 5px;">
            Durum bekleniyor...
        </div>

        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="E-posta"
                required
                autocomplete="off"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <input
                type="password"
                id="login-password"
                placeholder="Şifre"
                required
                autocomplete="new-password"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <button
                type="submit"
                class="button"
                style="width:100%;padding:15px;background:black;color:white;cursor:pointer;"
            >
                Giriş Yapmayı Dene
            </button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDiEf4SXghJpXUiHIrflLk8lnvaAk7LnUI",
        authDomain: "takasla-e2013.firebaseapp.com",
        projectId: "takasla-e2013",
        storageBucket: "takasla-e2013.firebasestorage.app",
        messagingSenderId: "324778736339",
        appId: "1:324778736339:web:d1c25d9aff143c35833226",
        measurementId: "G-CX29N06BZ7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("login-form");
    const sonucBox = document.getElementById("sonuc");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        sonucBox.style.color = "blue";
        sonucBox.innerText = "Firebase'e gönderiliyor...";

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            sonucBox.style.color = "green";
            sonucBox.innerText = "BAŞARILI: Şifre doğru, giriş yapıldı (" + userCredential.user.email + ")";
        } catch (error) {
            sonucBox.style.color = "red";
            sonucBox.innerText = "REDDEDİLDİ: Şifre yanlış! Firebase Hatası: " + error.code;
        }
    });
</script>

</body>
</html>
