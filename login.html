<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <img src="logo.svg" style="width:150px;display:block;margin:0 auto;" alt="Logo">
        <h2 style="text-align:center;">TAKASLASANA</h2>
        <p style="text-align:center;">Para Değil, Değer Takas Et.</p>

        <div id="status-box" style="padding: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; border-radius: 5px;"></div>

        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="E-posta"
                required
                autocomplete="off"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <input
                type="password"
                id="login-password"
                placeholder="Şifre"
                required
                autocomplete="current-password"
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <button
                type="submit"
                class="button"
                style="width:100%;padding:15px;margin-bottom:15px;cursor:pointer;"
            >
                Giriş Yap
            </button>
        </form>

        <button
            id="google-login"
            class="button"
            style="width:100%;padding:15px;background:#ffffff;color:#000;border:1px solid #ddd;margin-bottom:15px;cursor:pointer;"
        >
            Google ile Giriş Yap
        </button>

        <!-- Kayıt Ol Sayfasına Yönlendiren Buton -->
        <a href="register.html" style="display:block; width:100%; padding:15px; text-align:center; background:#28a745; color:#ffffff; text-decoration:none; border-radius:5px; font-weight:bold; box-sizing:border-box;">
            Hesabın Yok mu? Kayıt Ol
        </a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDiEf4SXghJpXUiHIrflLk8lnvaAk7LnUI",
        authDomain: "takasla-e2013.firebaseapp.com",
        projectId: "takasla-e2013",
        storageBucket: "takasla-e2013.firebasestorage.app",
        messagingSenderId: "324778736339",
        appId: "1:324778736339:web:d1c25d9aff143c35833226",
        measurementId: "G-CX29N06BZ7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const statusBox = document.getElementById("status-box");
    const loginForm = document.getElementById("login-form");

    if (loginForm) {
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            statusBox.style.color = "#000";
            statusBox.innerText = "Giriş yapılıyor...";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                statusBox.style.color = "green";
                statusBox.innerText = "Başarılı! Yönlendiriliyor...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            } catch (error) {
                statusBox.style.color = "red";
                statusBox.innerText = "Giriş Başarısız: E-posta veya şifre hatalı!";
            }
        });
    }

    const googleBtn = document.getElementById("google-login");
    if (googleBtn) {
        googleBtn.addEventListener("click", async () => {
            try {
                await signOut(auth);
                await signInWithPopup(auth, provider);
                window.location.href = "index.html";
            } catch (error) {
                statusBox.style.color = "red";
                statusBox.innerText = "Google Hatası: " + error.message;
            }
        });
    }
</script>

</body>
</html>
