<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <img src="logo.svg" style="width:150px;display:block;margin:0 auto;">

        <h2 style="text-align:center;">TAKASLASANA</h2>

        <p style="text-align:center;">
            Para Değil, Değer Takas Et.
        </p>

        <form id="login-form">

            <input
                type="email"
                id="login-email"
                placeholder="E-posta"
                required
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <input
                type="password"
                id="login-password"
                placeholder="Şifre"
                required
                style="width:100%;padding:15px;margin-bottom:15px;"
            >

            <button
                type="submit"
                class="button"
                style="width:100%;margin-bottom:15px;"
            >
                Giriş Yap
            </button>

        </form>

        <button
            id="google-login"
            class="button"
            style="
                width:100%;
                background:#ffffff;
                color:#000;
                border:1px solid #ddd;
            "
        >
            Google ile Giriş Yap
        </button>

        <p style="margin-top:20px;text-align:center;">
            Hesabın yok mu?
            <a href="register.html">Üye Ol</a>
        </p>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
