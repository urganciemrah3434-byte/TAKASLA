<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Eşya ve becerilerini para harcamadan takasla.">
  <title>Takaslasana — Eşya ve beceri takası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#172033; --muted:#62708a; --line:#e7eaf0; --bg:#f7f8fc; --violet:#6d28d9; --violet-soft:#f2ebff; --green:#059669; --card:#fff; --danger:#e11d48; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Plus Jakarta Sans",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .container { width:min(1180px, calc(100% - 32px)); margin-inline:auto; }
    .topbar { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .nav { min-height:72px; display:flex; align-items:center; gap:18px; justify-content:space-between; }
    .brand { color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; letter-spacing:-.6px; }
    .brand-mark { width:38px; height:38px; display:block; }
    .lang { width:auto; min-height:38px; padding:6px 9px; border-radius:10px; color:var(--muted); font-size:12px; font-weight:700; }
    .nav-actions { display:flex; align-items:center; gap:9px; }
    .button { border:0; border-radius:12px; padding:10px 15px; font-weight:700; background:#fff; color:var(--ink); }
    .button.primary { color:#fff; background:var(--violet); box-shadow:0 8px 18px #6d28d933; }
    .button.secondary { border:1px solid var(--line); }
    .hero { overflow:hidden; padding:68px 0 88px; text-align:center; background:radial-gradient(circle at 20% 0,#e9ddff 0,transparent 32%),linear-gradient(115deg,#f7edff,#e7edff); }
    .eyebrow { color:var(--violet); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { max-width:760px; margin:14px auto; font-size:clamp(34px,5vw,58px); line-height:1.08; letter-spacing:-2px; }
    h1 span { color:var(--violet); }
    .hero p { max-width:610px; margin:0 auto 25px; color:var(--muted); font-size:17px; }
    .hero-actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
    .category-bar { position:relative; margin-top:-31px; }
    .categories { display:flex; overflow-x:auto; gap:10px; padding:7px 2px 12px; scrollbar-width:none; }
    .chip { flex:0 0 auto; padding:10px 15px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:13px; font-size:13px; font-weight:700; }
    .chip[aria-pressed="true"] { color:var(--violet); border-color:#b99aff; background:var(--violet-soft); }
    main { display:grid; grid-template-columns:245px minmax(0,1fr); gap:25px; padding:28px 0 65px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; }
    .filters { height:max-content; padding:18px; }
    .filters h2 { margin:0 0 17px; font-size:16px; }
    label { display:block; margin:13px 0 6px; color:var(--muted); font-size:12px; font-weight:800; }
    input,select { width:100%; min-height:41px; border:1px solid var(--line); border-radius:10px; padding:9px 11px; color:var(--ink); background:#fff; }
    input:focus,select:focus,button:focus-visible { outline:3px solid #c4b5fd; outline-offset:2px; }
    .reset { width:100%; margin-top:18px; padding:9px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:10px; font-size:13px; font-weight:700; }
    .list-head { display:flex; justify-content:space-between; align-items:end; gap:15px; margin-bottom:18px; }
    .list-head h2 { margin:0; font-size:24px; letter-spacing:-.6px; }
    .count { color:var(--muted); font-size:13px; font-weight:700; }
    .sort { width:165px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
    .card { overflow:hidden; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:17px; transition:transform .2s,box-shadow .2s; }
    .card:hover { transform:translateY(-4px); box-shadow:0 14px 30px #17203314; }
    .card-image { position:relative; height:160px; background:#e9eef8; overflow:hidden; }
    .card-image img { width:100%; height:100%; object-fit:cover; display:block; }
    .badge { position:absolute; top:10px; left:10px; padding:4px 9px; border-radius:20px; color:#fff; background:var(--green); font-size:11px; font-weight:800; }
    .badge.service { background:var(--violet); }
    .card-body { padding:14px; }
    .card h3 { margin:0 0 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; }
    .meta { color:var(--muted); font-size:12px; }
    .want { min-height:38px; margin:10px 0; padding:7px 9px; color:var(--violet); background:var(--violet-soft); border-radius:9px; font-size:11px; font-weight:700; line-height:1.3; }
    .details { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
    .card-actions { display:flex; gap:7px; margin-top:12px; }
    .small-button { flex:1; padding:8px 5px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff; font-size:11px; font-weight:800; }
    .small-button.offer { border-color:var(--violet); color:#fff; background:var(--violet); }
    .empty { grid-column:1/-1; padding:45px 20px; color:var(--muted); text-align:center; background:#fff; border:1px dashed #cbd5e1; border-radius:16px; }
    dialog { width:min(530px,calc(100% - 28px)); max-height:90vh; padding:0; border:0; border-radius:18px; box-shadow:0 30px 90px #17203366; }
    dialog::backdrop { background:#17203388; backdrop-filter:blur(3px); }
    .dialog-content { padding:22px; }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .dialog-head h2 { margin:0; font-size:19px; }
    .close { width:34px; height:34px; border:0; border-radius:50%; font-size:22px; background:#f1f3f7; }
    .form-note { margin:10px 0; color:var(--muted); font-size:12px; }
    .form-actions { display:flex; justify-content:end; gap:8px; margin-top:20px; }
    .form-actions .button { border:1px solid var(--line); }
    .form-actions .primary { border-color:var(--violet); }
    .toast { position:fixed; z-index:20; right:20px; bottom:20px; max-width:330px; padding:12px 15px; color:#fff; background:var(--ink); border-radius:12px; box-shadow:0 12px 25px #17203344; transform:translateY(90px); opacity:0; transition:.25s; }
    .toast.show { transform:translateY(0); opacity:1; }
    @media (max-width:760px) { .nav { min-height:63px; } .nav .button.secondary { display:none; } .brand { font-size:17px; } .hero { padding:47px 0 70px; } .hero p { font-size:15px; } main { grid-template-columns:1fr; } .filters { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } .filters h2,.reset { grid-column:1/-1; } .list-head { align-items:start; flex-direction:column; } .sort { width:100%; } }
  </style>
</head>
<body>
  <header class="topbar"><nav class="container nav" aria-label="Ana menü">
    <a class="brand" href="#top" aria-label="Takaslasana ana sayfa">TAKASLASANA</a>
    <div class="nav-actions">
      <select id="language" class="lang" aria-label="Dil seçimi">
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="en">🇬🇧 English</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
      <button class="button secondary" id="favoritesButton" type="button">♡ Favoriler</button>
      <button class="button primary" id="openListing" type="button">+ İlan ver</button>
    </div>
  </nav></header>

  <section id="top" class="hero"><div class="container">
    <div class="eyebrow" id="heroEyebrow">Para değil, değer takas et</div>
    <h1 id="heroTitle">Eşyanı veya becerini takasla, <span id="heroSpan">ihtiyacını karşıla.</span></h1>
    <p id="heroDesc">Kullanmadığın eşyaları ya da yeteneklerini paylaş; karşılığında aradığın ürün veya hizmete ulaş.</p>
    <div class="hero-actions">
      <a class="button primary" id="heroExplore" href="#ilanlar">İlanları keşfet</a>
      <button class="button secondary" id="heroListing" type="button">İlan oluştur</button>
    </div>
  </div></section>

  <div class="container category-bar"><div class="categories" id="categories" aria-label="Kategoriler"></div></div>

  <main class="container" id="ilanlar">
    <aside class="panel filters">
      <h2 id="filterTitle">Filtrele</h2>
      <div><label for="search" id="lblSearch">Ara</label><input id="search" type="search" placeholder="İlan, takas veya kişi ara"></div>
      <div><label for="type" id="lblType">Takas türü</label>
        <select id="type">
          <option value="all">Tümü</option>
          <option value="item">Eşya</option>
          <option value="service">Hizmet</option>
        </select>
      </div>
      <div><label for="city" id="lblCity">Şehir</label>
        <select id="city">
          <option value="all">Tüm şehirler</option>
          <option>İstanbul</option>
          <option>Ankara</option>
          <option>İzmir</option>
          <option>Kastamonu</option>
        </select>
      </div>
      <button class="reset" id="reset" type="button">Filtreleri temizle</button>
    </aside>

    <section aria-labelledby="listTitle">
      <div class="list-head">
        <div><h2 id="listTitle">Aktif ilanlar</h2><span class="count" id="count" aria-live="polite"></span></div>
        <select id="sort" class="sort" aria-label="Sıralama">
          <option value="new">En yeniler</option>
          <option value="rating">Puanı yüksek olanlar</option>
        </select>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <dialog id="listingDialog">
    <form id="listingForm" class="dialog-content" method="dialog">
      <div class="dialog-head"><h2 id="dlgTitle">Yeni ilan oluştur</h2><button class="close" type="button" data-close aria-label="Pencereyi kapat">×</button></div>
      <p class="form-note" id="dlgNote">Bu ilanlar yalnızca bu tarayıcıda saklanır.</p>
      <label for="newTitle" id="lblNewTitle">İlan başlığı</label>
      <input id="newTitle" required minlength="3" maxlength="80" placeholder="Örn. Çalışır durumda espresso makinesi">
      
      <label for="newWanted" id="lblNewWanted">Karşılığında istediğin</label>
      <input id="newWanted" required minlength="3" maxlength="90" placeholder="Örn. Akustik gitar veya İngilizce dersi">
      
      <label for="newType" id="lblNewType">Takas türü</label>
      <select id="newType">
        <option value="item">Eşya veriyorum</option>
        <option value="service">Hizmet sunuyorum</option>
      </select>
      
      <label for="newCategory" id="lblNewCategory">Kategori</label>
      <select id="newCategory"></select>
      
      <label for="newCity" id="lblNewCity">Şehir</label>
      <select id="newCity">
        <option>İstanbul</option>
        <option>Ankara</option>
        <option>İzmir</option>
        <option>Kastamonu</option>
      </select>
      
      <label for="newUser" id="lblNewUser">Adın</label>
      <input id="newUser" required maxlength="40" placeholder="Örn. Ayşe K.">
      
      <div class="form-actions">
        <button class="button" type="button" data-close id="btnCancel">Vazgeç</button>
        <button class="button primary" type="submit" id="btnSave">İlanı kaydet</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';
    const CATEGORIES = ['Tümü','Elektronik','Ev & Yaşam','Eğitim','Ustalık','Hobi & Müzik','Yazılım & Tasarım'];
    
    const COPY = {
      tr:{
        fav:'♡ Favoriler',all:'♥ Tüm ilanlar',new:'+ İlan ver',close:'Vazgeç',save:'İlanı kaydet',added:'İlan başarıyla eklendi.',found:'ilan bulundu',empty:'İlan bulunamadı.',offer:'Teklif Yap',saved:'♥ Kaydedildi',bookmark:'♡ Kaydet',wanted:'İstenen',service:'Hizmet',item:'Eşya',
        searchPlaceholder:'İlan, takas veya kişi ara',activeListings:'Aktif İlanlar',filterTitle:'Filtrele',resetFilters:'Filtreleri Temizle',
        heroEyebrow:'Para değil, değer takas et',heroTitle:'Eşyanı veya becerini takasla, ',heroSpan:'ihtiyacını karşıla.',heroDesc:'Kullanmadığın eşyaları ya da yeteneklerini paylaş; karşılığında aradığın ürün veya hizmete ulaş.',heroExplore:'İlanları Keşfet',heroCreate:'İlan Oluştur'
      },
      en:{
        fav:'♡ Favorites',all:'♥ All listings',new:'+ Create listing',close:'Cancel',save:'Save listing',added:'Listing added successfully.',found:'listings found',empty:'No listings found.',offer:'Make Offer',saved:'♥ Saved',bookmark:'♡ Save',wanted:'Wanted',service:'Service',item:'Item',
        searchPlaceholder:'Search listing, swap or person',activeListings:'Active Listings',filterTitle:'Filter',resetFilters:'Clear Filters',
        heroEyebrow:'Trade value, not money',heroTitle:'Trade your goods or skills, ',heroSpan:'meet your needs.',heroDesc:'Share items or skills you don\'t use; get the product or service you are looking for in return.',heroExplore:'Explore Listings',heroCreate:'Create Listing'
      },
      ru:{ fav:'♡ Избранное',all:'♥ Все объявления',new:'+ Новое объявление',close:'Отмена',save:'Сохранить',added:'Объявление добавлено.',found:'объявлений',empty:'Ничего не найдено.',offer:'Предложить',saved:'♥ В избранном',bookmark:'♡ В избранное',wanted:'Нужно',service:'Услуга',item:'Вещь',searchPlaceholder:'Поиск...',activeListings:'Объявления',filterTitle:'Фильтр',resetFilters:'Сбросить',heroEyebrow:'Меняйте ценность',heroTitle:'Обменяйте вещи, ',heroSpan:'получите нужное.',heroDesc:'Делитесь тем, чем не пользуетесь.',heroExplore:'Смотреть',heroCreate:'Создать' },
      ar:{ fav:'♡ المفضلة',all:'♥ كل الإعلانات',new:'+ إعلان جديد',close:'إلغاء',save:'حفظ',added:'تمت الإضافة بنجاح.',found:'إعلان',empty:'لا توجد إعلانات.',offer:'تقديم عرض',saved:'♥ محفوظ',bookmark:'♡ حفظ',wanted:'المطلوب',service:'خدمة',item:'غرض',searchPlaceholder:'بحث...',activeListings:'الإعلانات النشطة',filterTitle:'تصفية',resetFilters:'مسح',heroEyebrow:'تبادل القيمة',heroTitle:'بادل أغراضك، ',heroSpan:'ولَبّ احتياجاتك.',heroDesc:'شارك الأشياء التي لا تستخدمها.',heroExplore:'استكشف',heroCreate:'إنشاء' },
      de:{ fav:'♡ Favoriten',all:'♥ Alle',new:'+ Erstellen',close:'Abbrechen',save:'Speichern',added:'Erfolgreich hinzugefügt.',found:'Anzeigen',empty:'Keine Anzeigen.',offer:'Angebot',saved:'♥ Gespeichert',bookmark:'♡ Speichern',wanted:'Gesucht',service:'Dienst',item:'Artikel',searchPlaceholder:'Suchen...',activeListings:'Aktive Anzeigen',filterTitle:'Filter',resetFilters:'Zurücksetzen',heroEyebrow:'Wert tauschen',heroTitle:'Tausche Dinge, ',heroSpan:'decke Bedarf.',heroDesc:'Teile Dinge, die du nicht nutzt.',heroExplore:'Entdecken',heroCreate:'Erstellen' }
    };

    // Gerçekçi Stok Resimler (Unsplash Direct High-Res IDs)
    const REAL_IMAGE_MAP = {
      'gitar': 'https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=600&auto=format&fit=crop&q=80',
      'boya': 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=600&auto=format&fit=crop&q=80',
      'takim': 'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600&auto=format&fit=crop&q=80',
      'matematik': 'https://images.unsplash.com/photo-1509062522246-3755977927d7?w=600&auto=format&fit=crop&q=80',
      'ps4': 'https://images.unsplash.com/photo-1507457379470-08b800bebc67?w=600&auto=format&fit=crop&q=80',
      'logo': 'https://images.unsplash.com/photo-1626785774573-4b799315345d?w=600&auto=format&fit=crop&q=80',
      'klavye': 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&auto=format&fit=crop&q=80',
      'cadir': 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=600&auto=format&fit=crop&q=80',
      'kahve': 'https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=600&auto=format&fit=crop&q=80',
      'monitor': 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=600&auto=format&fit=crop&q=80',
      'bisiklet': 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600&auto=format&fit=crop&q=80',
      'yoga': 'https://images.unsplash.com/photo-1545205597-3d9d02c29597?w=600&auto=format&fit=crop&q=80',
      'masa': 'https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=600&auto=format&fit=crop&q=80',
      'airfryer': 'https://images.unsplash.com/photo-1585515320310-259814833e62?w=600&auto=format&fit=crop&q=80'
    };

    const SEED_DATA = [
      { id:1, type:'item', title:'Az Kullanılmış Klasik Gitar', wanted:'A2 Almanca Dersi', user:'Seda C.', city:'Ankara', category:'Hobi & Müzik', rating:4.8, image:REAL_IMAGE_MAP.gitar },
      { id:2, type:'service', title:'2+1 Daire Boya Badana İşçiliği', wanted:'Laptop / Tablet', user:'Mustafa Usta', city:'İstanbul', category:'Ustalık', rating:4.9, image:REAL_IMAGE_MAP.boya },
      { id:3, type:'item', title:'Siyah Erkek Takım Elbise (48 Beden)', wanted:'Bluetooth Kulaklık', user:'Ahmet Y.', city:'Kastamonu', category:'Ev & Yaşam', rating:4.7, image:REAL_IMAGE_MAP.takim },
      { id:4, type:'service', title:'LGS / YKS Matematik Özel Dersi', wanted:'Çalışma Masası', user:'Elif Hoca', city:'İzmir', category:'Eğitim', rating:5.0, image:REAL_IMAGE_MAP.matematik },
      { id:5, type:'item', title:'PlayStation 4 + 2 Adet Kol', wanted:'Akıllı Saat', user:'Burak T.', city:'İstanbul', category:'Elektronik', rating:4.6, image:REAL_IMAGE_MAP.ps4 },
      { id:6, type:'service', title:'Kurumsal Logo & Grafik Tasarım', wanted:'İngilizce Konuşma Pratiği', user:'Deniz A.', city:'Ankara', category:'Yazılım & Tasarım', rating:4.9, image:REAL_IMAGE_MAP.logo },
      { id:7, type:'item', title:'Mekanik RGB Klavye (Red Switch)', wanted:'Kablosuz Mouse', user:'Ozan K.', city:'İzmir', category:'Elektronik', rating:4.5, image:REAL_IMAGE_MAP.klavye },
      { id:8, type:'item', title:'3 Kişilik Su Geçirmez Kamp Çadırı', wanted:'Kamp Sandalyesi Seti', user:'Can D.', city:'Kastamonu', category:'Hobi & Müzik', rating:4.8, image:REAL_IMAGE_MAP.cadir },
      { id:9, type:'item', title:'Filtre Kahve Makinesi (Temiz)', wanted:'Masa Lambası', user:'Zeynep K.', city:'İzmir', category:'Ev & Yaşam', rating:4.6, image:REAL_IMAGE_MAP.kahve },
      { id:10, type:'item', title:'27 inç Full HD Oyuncu Monitörü', wanted:'Ofis Koltuğu', user:'Yusuf E.', city:'Ankara', category:'Elektronik', rating:4.7, image:REAL_IMAGE_MAP.monitor },
      { id:11, type:'item', title:'20 Jant Kırmızı Çocuk Bisikleti', wanted:'Çocuk Kitap Seti', user:'Nihan P.', city:'İzmir', category:'Ev & Yaşam', rating:4.8, image:REAL_IMAGE_MAP.bisiklet },
      { id:12, type:'service', title:'Birebir Yoga ve Nefes Egzersizi', wanted:'Seramik Atölye Dersi', user:'Derya N.', city:'İstanbul', category:'Eğitim', rating:4.7, image:REAL_IMAGE_MAP.yoga },
      { id:13, type:'item', title:'Ahşap Çalışma Masası (Beyaz)', wanted:'Kitaplık / Raf', user:'İlayda Y.', city:'İzmir', category:'Ev & Yaşam', rating:4.6, image:REAL_IMAGE_MAP.masa },
      { id:14, type:'item', title:'Xiaomi Air Fryer XL (Az Kullanıldı)', wanted:'Blender Seti', user:'Sibel D.', city:'İzmir', category:'Ev & Yaşam', rating:4.8, image:REAL_IMAGE_MAP.airfryer }
    ];

    const storeKey = 'takaslasana_listings_v5', favKey = 'takaslasana_favs_v5';
    
    // Eski veya bozuk verileri temizleme garantisi
    if(!localStorage.getItem(storeKey)) {
      localStorage.setItem(storeKey, JSON.stringify(SEED_DATA));
    }

    const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
    
    let listings = read(storeKey, SEED_DATA);
    let favorites = new Set(read(favKey, []));
    let onlyFavorites = false;
    let activeCategory = 'Tümü';
    let language = 'tr';
    
    const $ = (id) => document.getElementById(id);
    const save = () => localStorage.setItem(storeKey, JSON.stringify(listings));
    const toast = (text) => { const el=$('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.classList.remove('show'),2800); };
    
    function categories() { 
      const holder=$('categories'); 
      holder.replaceChildren(); 
      CATEGORIES.forEach(category => { 
        const button=document.createElement('button'); 
        button.type='button'; 
        button.className='chip'; 
        button.textContent=category; 
        button.setAttribute('aria-pressed', String(category===activeCategory)); 
        button.addEventListener('click',()=>{ activeCategory=category; categories(); render(); }); 
        holder.append(button); 
      }); 
    }

    function visibleListings() { 
      const q=$('search').value.trim().toLocaleLowerCase(language==='tr'?'tr':'en'); 
      const type=$('type').value; 
      const city=$('city').value; 
      const sort=$('sort').value; 
      return listings.filter(item => 
        (!onlyFavorites||favorites.has(item.id)) && 
        (type==='all'||item.type===type) && 
        (city==='all'||item.city===city) && 
        (activeCategory==='Tümü'||item.category===activeCategory) && 
        (!q||[item.title,item.wanted,item.user,item.category,item.city].some(value=>String(value).toLocaleLowerCase(language==='tr'?'tr':'en').includes(q)))
      ).sort((a,b)=>sort==='rating'?b.rating-a.rating:b.id-a.id); 
    }

    function element(tag, options={}) { const el=document.createElement(tag); Object.assign(el, options); return el; }

    function render() { 
      const t=COPY[language], items=visibleListings(), holder=$('cards'); 
      holder.replaceChildren(); 
      $('count').textContent=`${items.length} ${t.found}`; 
      $('favoritesButton').textContent=onlyFavorites?t.all:t.fav; 
      $('openListing').textContent=t.new;
      
      if(!items.length) { 
        const empty=element('div',{className:'empty',textContent:t.empty}); 
        holder.append(empty); 
        return; 
      } 
      items.forEach(item=>holder.append(card(item))); 
    }

    function card(item) { 
      const t=COPY[language], article=element('article',{className:'card'}), imageBox=element('div',{className:'card-image'}), image=element('img',{src:item.image,alt:item.title,loading:'lazy'}), badge=element('span',{className:`badge ${item.type==='service'?'service':''}`,textContent:item.type==='service'?t.service:t.item}), body=element('div',{className:'card-body'}); 
      
      image.onerror=()=>{ image.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop&q=80'; }; 
      imageBox.append(image,badge); 
      
      const title=element('h3',{textContent:item.title}), user=element('div',{className:'meta',textContent:`${item.user} · ${item.category}`}), want=element('div',{className:'want',textContent:`${t.wanted}: ${item.wanted}`}), details=element('div',{className:'details'}); 
      details.append(element('span',{textContent:`📍 ${item.city}`}),element('span',{textContent:`★ ${item.rating.toFixed(1)}`})); 
      
      const actions=element('div',{className:'card-actions'}), fav=element('button',{className:'small-button',type:'button',textContent:favorites.has(item.id)?t.saved:t.bookmark}), offer=element('button',{className:'small-button offer',type:'button',textContent:t.offer}); 
      
      fav.addEventListener('click',()=>{ 
        favorites.has(item.id)?favorites.delete(item.id):favorites.add(item.id); 
        localStorage.setItem(favKey,JSON.stringify([...favorites])); 
        render(); 
      }); 
      
      offer.addEventListener('click',()=>toast(`“${item.title}” için teklif yapma özelliği yakında aktif olacaktır.`)); 
      
      actions.append(fav,offer); 
      body.append(title,user,want,details,actions); 
      article.append(imageBox,body); 
      return article; 
    }

    function openDialog(){ $('listingDialog').showModal(); $('newTitle').focus(); }

    function updateLanguageTexts() {
      const t = COPY[language];
      $('search').placeholder = t.searchPlaceholder;
      $('listTitle').textContent = t.activeListings;
      $('filterTitle').textContent = t.filterTitle;
      $('reset').textContent = t.resetFilters;
      $('heroEyebrow').textContent = t.heroEyebrow;
      $('heroTitle').childNodes[0].textContent = t.heroTitle;
      $('heroSpan').textContent = t.heroSpan;
      $('heroDesc').textContent = t.heroDesc;
      $('heroExplore').textContent = t.heroExplore;
      $('heroListing').textContent = t.heroCreate;
    }

    CATEGORIES.slice(1).forEach(category => $('newCategory').append(element('option',{value:category,textContent:category})));
    
    $('openListing').addEventListener('click',openDialog); 
    $('heroListing').addEventListener('click',openDialog); 
    document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$('listingDialog').close()));
    
    $('listingForm').addEventListener('submit',event=>{ 
      event.preventDefault(); 
      if(!event.currentTarget.reportValidity()) return; 
      
      const categorySelected = $('newCategory').value;
      const item={
        id:Date.now(),
        type:$('newType').value,
        title:$('newTitle').value.trim(),
        wanted:$('newWanted').value.trim(),
        category:categorySelected,
        city:$('newCity').value,
        user:$('newUser').value.trim(),
        rating:5.0,
        image:REAL_IMAGE_MAP.masa
      }; 
      
      listings.unshift(item); 
      save(); 
      event.currentTarget.reset(); 
      $('listingDialog').close(); 
      activeCategory='Tümü'; 
      categories(); 
      render(); 
      toast(COPY[language].added); 
    });

    ['search','type','city','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render)); 
    
    $('favoritesButton').addEventListener('click',()=>{ onlyFavorites=!onlyFavorites; render(); }); 
    
    $('reset').addEventListener('click',()=>{ 
      $('search').value=''; 
      $('type').value='all'; 
      $('city').value='all'; 
      $('sort').value='new'; 
      onlyFavorites=false; 
      activeCategory='Tümü'; 
      categories(); 
      render(); 
    });

    $('language').addEventListener('change',event=>{ 
      language=event.target.value; 
      document.documentElement.lang=language; 
      document.documentElement.dir=language==='ar'?'rtl':'ltr'; 
      updateLanguageTexts();
      render(); 
    });

    // Sayfa yükleme
    categories(); 
    updateLanguageTexts();
    render();
  </script>
</body>
</html>
