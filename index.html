<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKASLA - Eşya ve Hizmet Takas Platformu</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --badge-item-bg: #e0e7ff;
            --badge-item-text: #3730a3;
            --badge-service-bg: #fef3c7;
            --badge-service-text: #92400e;
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-item-bg: #312e81;
            --badge-item-text: #c7d2fe;
            --badge-service-bg: #78350f;
            --badge-service-text: #fde68a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* HEADER & NAVBAR */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* HERO & CATEGORIES */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            color: var(--primary-color);
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .cat-chip {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .cat-chip.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* CARD GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            height: 180px;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-type {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-item { background: var(--badge-item-bg); color: var(--badge-item-text); }
        .badge-service { background: var(--badge-service-bg); color: var(--badge-service-text); }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .card-footer {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-overlay);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            border: none; background: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">TAKASLA</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Eşya, hizmet veya şehir ara...">
            </div>
            <div class="nav-actions">
                <button class="btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
                <button class="btn" id="langBtn" onclick="toggleLanguage()">TR 🇹🇷</button>
                <button class="btn btn-primary" onclick="handlePostAdClick()">+ İlan Ver</button>
                <button class="btn" id="loginNavBtn" onclick="showModal('loginModal')">Giriş Yap</button>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="hero">
            <h1 id="heroTitle">Eşyanı veya becerini takasla, <span>ihtiyacını karşıla.</span></h1>
            <p style="color: var(--text-muted);">Para harcamadan takas yapabileceğin Türkiye'nin modern pazar yeri.</p>
        </section>

        <!-- CATEGORIES -->
        <div class="categories">
            <div class="cat-chip active" onclick="setCategory(this)">Tümü</div>
            <div class="cat-chip" onclick="setCategory(this)">Elektronik</div>
            <div class="cat-chip" onclick="setCategory(this)">Ev & Yaşam</div>
            <div class="cat-chip" onclick="setCategory(this)">Hobi & Müzik</div>
            <div class="cat-chip" onclick="setCategory(this)">Eğitim</div>
            <div class="cat-chip" onclick="setCategory(this)">Ustalık & Hizmet</div>
        </div>

        <!-- LISTINGS GRID -->
        <div id="listingsGrid" class="grid"></div>
    </main>

    <!-- DETAY MODAL -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <h2 id="dTitle" style="margin-bottom: 0.5rem;">İlan Başlığı</h2>
            <p id="dCategory" style="color: var(--primary-color); font-weight: 600; margin-bottom: 1rem;">Kategori • Şehir</p>
            <p id="dDesc" style="color: var(--text-muted); margin-bottom: 1.5rem;">Detay açıklaması burada yer alacak.</p>
            <button class="btn btn-primary" style="width: 100%;" onclick="alert('Teklif Gönderildi!')">Takas Teklifi Gönder</button>
        </div>
    </div>

    <!-- GİRİŞ MODAL -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            <h2 style="margin-bottom: 1.5rem;">Giriş Yap</h2>
            <form onsubmit="handleLoginFormSubmit(event)">
                <div class="form-group">
                    <label>E-Posta</label>
                    <input type="email" required placeholder="ornek@email.com">
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 0.5rem;">Giriş Yap</button>
                <button type="button" class="btn" style="width: 100%;" onclick="googleLogin()">Google ile Giriş Yap</button>
            </form>
        </div>
    </div>

    <!-- İLAN VER MODAL -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('postModal')">&times;</button>
            <h2 style="margin-bottom: 1.5rem;">Yeni İlan Oluştur</h2>
            <form onsubmit="handleFormSubmit(event, 'İlanınız başarıyla yayınlandı!')">
                <div class="form-group">
                    <label>Başlık</label>
                    <input type="text" required placeholder="Örn: Gitarımı Amfi ile Takaslıyorum">
                </div>
                <div class="form-group">
                    <label>Takas Türü</label>
                    <select>
                        <option value="item">Eşya Takası</option>
                        <option value="service">Hizmet Takası</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Açıklama & Aranan Takas</label>
                    <textarea rows="3" required placeholder="Eşyanızın durumunu ve ne ile takas etmek istediğinizi yazın..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">İlanı Yayınla</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // KULLANICI OTURUM DURUMU
        let isLoggedIn = false;
        let currentLang = 'TR';

        // VERİ SETİ (25 ADET İLAN)
        const rawListings = [
            { id: 1, title: "Fender Akustik Gitar", type: "item", cat: "Hobi & Müzik", city: "İstanbul", date: "Bugün", img: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=500", desc: "Elektro gitar veya amfi ile takas etmek istiyorum." },
            { id: 2, title: "Boya & Badana Ustası", type: "service", cat: "Ustalık & Hizmet", city: "Ankara", date: "Dün", img: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500", desc: "Ev boya hizmeti karşılığında Web Tasarımı arıyorum." },
            { id: 3, title: "Matematik Özel Dersi", type: "service", cat: "Eğitim", city: "İzmir", date: "3 gün önce", img: "https://images.unsplash.com/photo-1577896851231-70ef18881754?w=500", desc: "LGS/YKS için matematik dersi. Tablet takasına açıktır." },
            { id: 4, title: "Sony PlayStation 5", type: "item", cat: "Elektronik", city: "Bursa", date: "Bugün", img: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=500", desc: "İki kollu PS5. Gaming Laptop ile takaslanabilir." },
            { id: 5, title: "Vintage Ahşap Yemek Masası", type: "item", cat: "Ev & Yaşam", city: "Antalya", date: "2 gün önce", img: "https://images.unsplash.com/photo-1615066390971-03e4e1c36ddf?w=500", desc: "Gerçek meşe ağacı. Bisiklet ile takas düşünülür." },
            { id: 6, title: "İngilizce Pratik Seansı", type: "service", cat: "Eğitim", city: "İstanbul", date: "Bugün", img: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=500", desc: "Native konuşma pratiği. İspanyolca dersi karşılığı verilir." },
            { id: 7, title: "Oto Arıza Tespiti & Tamir", type: "service", cat: "Ustalık & Hizmet", city: "Ankara", date: "4 gün önce", img: "https://images.unsplash.com/photo-1486006920555-c77dce18193b?w=500", desc: "Bilgisayarlı arıza tespiti. Akıllı telefon takası aranıyor." },
            { id: 8, title: "Canon EOS M50 Kamera", type: "item", cat: "Elektronik", city: "İzmir", date: "Dün", img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500", desc: "Temiz vlog kamerası. iPad ile takas olur." },
            { id: 9, title: "Trek Dağ Bisikleti", type: "item", cat: "Hobi & Müzik", city: "Bursa", date: "5 gün önce", img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500", desc: "21 vites dağ bisikleti. Kamp ekipmanı karşılığı verilir." },
            { id: 10, title: "Web Tasarım & Logo Hizmeti", type: "service", cat: "Ustalık & Hizmet", city: "İstanbul", date: "Bugün", img: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500", desc: "Modern web sitesi kurulur. Koltuk takımı ile takas edilir." },
            { id: 11, title: "Pilates & Yoga Eğitimi", type: "service", cat: "Eğitim", city: "İzmir", date: "1 gün önce", img: "https://images.unsplash.com/photo-1545205597-3d9d02c29597?w=500", desc: "Birebir özel seans. Akıllı saat takasına uygundur." },
            { id: 12, title: "Nintendo Switch OLED", type: "item", cat: "Elektronik", city: "Ankara", date: "Bugün", img: "https://images.unsplash.com/photo-1578303512597-81e6cc155b3e?w=500", desc: "Kutulu az kullanılmış cihaz. Monitör takasına açık." },
            { id: 13, title: "4 Kişilik Kamp Çadırı", type: "item", cat: "Hobi & Müzik", city: "Antalya", date: "3 gün önce", img: "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500", desc: "Su geçirmez çadır. Olta takımı ile takaslanabilir." },
            { id: 14, title: "Piyano Dersleri", type: "service", cat: "Eğitim", city: "İstanbul", date: "Dün", img: "https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=500", desc: "Başlangıç seviye özel piyano dersi. Şan dersi arıyorum." },
            { id: 15, title: "Elektrik Arıza & Tesisat", type: "service", cat: "Ustalık & Hizmet", city: "Bursa", date: "Bugün", img: "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=500", desc: "Ev/ofis elektrik işleri yapılır. Matkap takası kabul edilir." },
            { id: 16, title: "Dyson Airwrap Şekillendirici", type: "item", cat: "Ev & Yaşam", city: "İstanbul", date: "2 gün önce", img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500", desc: "Orijinal kutulu cihaz. iPhone 11 ve üzeri ile takas." },
            { id: 17, title: "İspanyolca Dersi", type: "service", cat: "Eğitim", city: "Ankara", date: "Bugün", img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500", desc: "A1-B2 seviye dersler. Grafik tasarım hizmeti arıyorum." },
            { id: 18, title: "Espresso Kahve Makinesi", type: "item", cat: "Ev & Yaşam", city: "İzmir", date: "4 gün önce", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500", desc: "Barista tipi manuel makine. Filtre kahve makinesi + fark ile." },
            { id: 19, title: "Profesyonel Fotoğraf Çekimi", type: "service", cat: "Ustalık & Hizmet", city: "İstanbul", date: "1 gün önce", img: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?w=500", desc: "Ürün veya portre çekimi. Vintage stüdyo ışığı aranıyor." },
            { id: 20, title: "Apple iPad Air 5. Nesil", type: "item", cat: "Elektronik", city: "Bursa", date: "Bugün", img: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500", desc: "M1 işlemcili, çiziksiz. MacBook Air ile takas düşünülür." },
            { id: 21, title: "Dikiş & Kıyafet Tasarımı", type: "service", cat: "Ustalık & Hizmet", city: "Antalya", date: "3 gün önce", img: "https://images.unsplash.com/photo-1528458901490-281b3749448f?w=500", desc: "Özel dikim veya tadilat. Dikiş makinesi takası aranıyor." },
            { id: 22, title: "Yamaha Dijital Piyano", type: "item", cat: "Hobi & Müzik", city: "Ankara", date: "Dün", img: "https://images.unsplash.com/photo-1552422535-c45813c61732?w=500", desc: "88 tuşlu weighted klavye. Ses kartı ve referans monitörü takas." },
            { id: 23, title: "Ev/Ofis Derinlemesine Temizlik", type: "service", cat: "Ustalık & Hizmet", city: "İzmir", date: "5 gün önce", img: "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=500", desc: "Detaylı temizlik hizmeti. Robot süpürge takasına açık." },
            { id: 24, title: "Diyetisyen & Beslenme Danışmanlığı", type: "service", cat: "Eğitim", city: "İstanbul", date: "Bugün", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500", desc: "1 aylık online takip programı. Pilates matı veya dambıl seti takası." },
            { id: 25, title: "Akustik Ses Yalıtım Panelleri", type: "item", cat: "Ev & Yaşam", city: "Bursa", date: "2 gün önce", img: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=500", desc: "12 adet sünger panel. Kondansatör mikrofon ile takaslanır." }
        ];

        // İLANLARI RENDER ETME
        function renderListings(data) {
            const grid = document.getElementById('listingsGrid');
            grid.innerHTML = '';

            data.forEach(item => {
                const isService = item.type === 'service';
                const badgeClass = isService ? 'badge-service' : 'badge-item';
                const badgeText = isService ? 'Hizmet Takası' : 'Eşya Takası';

                const cardHTML = `
                    <div class="card" onclick="openDetailModal(${item.id})">
                        <div class="card-img-wrap">
                            <img src="${item.img}" alt="${item.title}" class="card-img" loading="lazy">
                            <span class="badge-type ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="card-body">
                            <div>
                                <h3 class="card-title">${item.title}</h3>
                                <p style="font-size: 0.8rem; color: var(--text-muted);">${item.cat}</p>
                            </div>
                            <div class="card-footer">
                                <span>📍 ${item.city}</span>
                                <span>🕒 ${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // MODAL YÖNETİMİ
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openDetailModal(id) {
            const item = rawListings.find(l => l.id === id);
            if (!item) return;

            document.getElementById('dTitle').innerText = item.title;
            document.getElementById('dCategory').innerText = `${item.cat} • ${item.city}`;
            document.getElementById('dDesc').innerText = item.desc;
            showModal('detailModal');
        }

        function handlePostAdClick() {
            if (!isLoggedIn) {
                showModal('loginModal');
            } else {
                showModal('postModal');
            }
        }

        // OTURUM İŞLEMLERİ
        function handleLoginFormSubmit(e) {
            e.preventDefault();
            isLoggedIn = true;
            document.getElementById('loginNavBtn').innerText = 'Hesabım';
            closeModal('loginModal');
            alert('Giriş başarılı! Artık ilan verebilirsiniz.');
        }

        function googleLogin() {
            isLoggedIn = true;
            document.getElementById('loginNavBtn').innerText = 'Hesabım';
            closeModal('loginModal');
            alert('Google ile giriş başarılı!');
        }

        function handleFormSubmit(e, message) {
            e.preventDefault();
            alert(message);
            closeModal('postModal');
        }

        // FİLTRELEME
        function setCategory(element) {
            document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            
            const catName = element.innerText.trim();
            if (catName === 'Tümü' || catName === 'All') {
                renderListings(rawListings);
            } else {
                const filtered = rawListings.filter(item => item.cat.includes(catName));
                renderListings(filtered);
            }
        }

        // DARK MODE
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // ÇOKLU DİL
        function toggleLanguage() {
            const langBtn = document.getElementById('langBtn');
            const heroTitle = document.getElementById('heroTitle');
            
            if (currentLang === 'TR') {
                currentLang = 'EN';
                langBtn.innerText = 'EN 🇬🇧';
                heroTitle.innerHTML = 'Trade your goods or skills, <span>get what you need.</span>';
            } else {
                currentLang = 'TR';
                langBtn.innerText = 'TR 🇹🇷';
                heroTitle.innerHTML = 'Eşyanı veya becerini takasla, <span>ihtiyacını karşıla.</span>';
            }
        }

        // CANLI ARAMA
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = rawListings.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query) ||
                item.city.toLowerCase().includes(query)
            );
            renderListings(filtered);
        });

        // İLK YÜKLEME
        document.addEventListener('DOMContentLoaded', () => {
            renderListings(rawListings);
        });
    </script>
</body>
</html>
