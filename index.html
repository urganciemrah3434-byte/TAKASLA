<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takaslasana.com - Güvenli Dijital Takas Platformu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text-color); }
    .hero p { color: #64748b; font-size: 1.1rem; }
    .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .listing-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.2s; display: flex; flex-direction: column; }
    .listing-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .listing-img { width: 100%; height: 180px; object-fit: cover; }
    .listing-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .listing-category { font-size: 0.8rem; background: #e0e7ff; color: var(--primary-color); padding: 3px 8px; border-radius: 4px; width: max-content; margin-bottom: 8px; font-weight: 600; }
    .listing-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; height: 50px; overflow: hidden; }
    .listing-wanted { font-size: 0.9rem; color: #475569; margin-bottom: 15px; background: #f1f5f9; padding: 8px; border-radius: 6px; }
    .listing-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.9rem; }
    .btn-action { background: var(--primary-color); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action:hover { opacity: 0.9; }
    
    /* Modal Tasarımları */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content { background: var(--card-bg); margin: 10% auto; padding: 25px; border-radius: 12px; max-width: 400px; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: #64748b; }
    footer { text-align: center; padding: 30px; margin-top: 50px; border-top: 1px solid var(--border-color); color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- Üst Menü -->
  <header>
    <a href="#" class="logo"><i class="fa-solid fa-rotate"></i> Takaslasana</a>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button onclick="openModal('loginModal')" style="background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        <i class="fa-solid fa-right-to-bracket"></i> Giriş Yap
      </button>
      <button onclick="openModal('registerModal')" class="btn-action">
        <i class="fa-solid fa-user-plus"></i> Yeni Kullanıcı
      </button>
    </div>
  </header>

  <!-- Ana İçerik -->
  <div class="container">
    <div class="hero">
      <h1>Kullanmadıklarını Takas Et, Değerlendir!</h1>
      <p>Yüzlerce farklı ilan arasından aradığını bul ya da kendi eşyanı/hizmetini takasa aç.</p>
    </div>

    <!-- İlanların Listeleneceği Alan -->
    <div id="listingsGrid" class="listings-grid">
      <!-- JavaScript ile 100 ilan buraya yüklenecek -->
    </div>
  </div>

  <!-- Giriş Yap Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
      <h3 style="margin-bottom: 20px; color: var(--primary-color);"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</h3>
      <form onsubmit="handleLogin(event)">
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">E-Posta Adresi</label>
          <input type="email" id="loginEmail" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Şifre</label>
          <input type="password" id="loginPassword" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
        </div>
        <button type="submit" class="btn-action" style="width: 100%; padding: 12px; justify-content: center;">Giriş Yap</button>
      </form>
    </div>
  </div>

  <!-- Yeni Kullanıcı Modal -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
      <h3 style="margin-bottom: 20px; color: var(--primary-color);"><i class="fa-solid fa-user-plus"></i> Yeni Kullanıcı Kaydı</h3>
      <form onsubmit="handleRegister(event)">
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Ad Soyad</label>
          <input type="text" id="regName" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">E-Posta Adresi</label>
          <input type="email" id="regEmail" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Şifre</label>
          <input type="password" id="regPassword" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;">
        </div>
        <button type="submit" class="btn-action" style="width: 100%; padding: 12px; justify-content: center;">Kayıt Ol</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Takaslasana.com - Tüm hakları saklıdır.</p>
  </footer>

    // Sayfa Yüklendiğinde İlanları Ekrana Basma
    function renderListings() {
      const grid = document.getElementById('listingsGrid');
      grid.innerHTML = '';
      
      rawListings.forEach(item => {
        const card = document.createElement('div');
        card.className = 'listing-card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}" class="listing-img">
          <div class="listing-content">
            <span class="listing-category">${item.category}</span>
            <h3 class="listing-title">${item.title}</h3>
            <div class="listing-wanted">
              <strong>İstenen:</strong> ${item.wanted}
            </div>
            <div class="listing-footer">
              <span><i class="fa-solid fa-location-dot"></i> ${item.city}</span>
              <button onclick="alert('İlan Sahibi: ${item.user}\\nPuan: ${item.rating} ⭐')" class="btn-action" style="padding: 6px 12px; font-size: 0.85rem;">Takas Teklif Et</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal Kontrolleri
    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'block';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      alert(`Hoş geldiniz! (${email}) başarıyla giriş yaptınız.`);
      closeModal('loginModal');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }

    function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('regName').value;
      alert(`Tebrikler ${name}, hesabınız başarıyla oluşturuldu!`);
      closeModal('registerModal');
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPassword').value = '';
    }

    // Uygulamayı Başlat
    window.onload = function() {
      renderListings();
    };
  </script>
