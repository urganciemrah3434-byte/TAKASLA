<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim & Takas Teklifleri - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        .offers-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .offer-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            background: #fafafa;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-pending { background: #ffeeba; color: #856404; }
        .badge-accepted { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }
        .btn-accept { background: #28a745; color: white; }
        .btn-reject { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <header style="display:flex; justify-content:space-between; align-items:center; padding:15px 30px; background:#007bff; color:white;">
        <div>
            <h1 style="margin:0; font-size:24px;"><a href="index.html" style="color:white; text-decoration:none;">TAKASLASANA</a></h1>
            <small>Satma, Takaslasana!</small>
        </div>
        <nav>
            <a href="index.html" style="color:white; margin-right:15px; text-decoration:none;">İlanlar</a>
            <a href="add-listing.html" style="color:white; margin-right:15px; text-decoration:none;">+ İlan Ekle</a>
            <a href="profile.html" style="color:white; font-weight:bold; text-decoration:underline;">Profilim</a>
        </nav>
    </header>

    <div class="profile-container">
        <h2>👤 Profil & Takas Yönetimi</h2>
        <p id="user-email-display" style="color:#666;"></p>

        <!-- Gelen Teklifler -->
        <div class="offers-section">
            <h3 style="color:#28a745; margin-top:0;">📥 Sana Gelen Takas Teklifleri</h3>
            <div id="incoming-offers">
                <p>Yükleniyor...</p>
            </div>
        </div>

        <!-- Gönderilen Teklifler -->
        <div class="offers-section">
            <h3 style="color:#007bff; margin-top:0;">📤 Sen Takas Teklifi Ettiklerin</h3>
            <div id="outgoing-offers">
                <p>Yükleniyor...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
