<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Ekle - TAKASLASANA</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .drop-zone {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            margin-top: 5px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: #e9ecef;
            border-color: #0056b3;
        }
        .drop-zone img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html" style="color:white; text-decoration:none;">TAKASLASANA</a></h1>
        <h3>Satma, Takaslasana!</h3>
    </header>

    <div class="container">
        <div class="card" style="max-width:600px; margin:20px auto; padding:20px;">
            <h2>Yeni Takas İlanı Oluştur</h2>
            <form id="add-listing-form">
                <p>
                    <label><strong>Ürün/Eşya Adı:</strong></label><br>
                    <input type="text" id="item-title" placeholder="Örn: iPhone 11 64GB" required style="width:100%; padding:10px; margin-top:5px;">
                </p>
                <p>
                    <label><strong>Ürün Açıklaması:</strong></label><br>
                    <textarea id="item-desc" placeholder="Ürünün durumu, kullanım süresi vb." rows="4" required style="width:100%; padding:10px; margin-top:5px;"></textarea>
                </p>
                <p>
                    <label><strong>Ne ile Takas Düşünüyorsun?:</strong></label><br>
                    <input type="text" id="item-target" placeholder="Örn: Oyuncu Bilgisayarı veya Elektrikli Bisiklet" required style="width:100%; padding:10px; margin-top:5px;">
                </p>
                <p>
                    <label><strong>Ürün Fotoğrafı:</strong></label><br>
                    <div class="drop-zone" id="drop-zone">
                        <span id="drop-zone-text">📸 Görseli buraya sürükleyip bırakın veya <strong>tıklayıp seçin</strong></span>
                        <input type="file" id="item-image-file" accept="image/*" style="display:none;">
                        <img id="image-preview" src="" alt="Önizleme">
                    </div>
                </p>
                <p>
                    <button type="submit" id="submit-btn" class="button" style="width:100%; padding:12px; background-color:#28a745; color:white; font-weight:bold; cursor:pointer; border:none; border-radius:5px;">İLAN YAYINLA</button>
                </p>
            </form>
        </div>
    </div>

    <!-- İlan Scripti -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
